<!-- The button that triggers the modal -->
<button id="openModalBtn" aria-haspopup="dialog">Open Accessible Modal</button>

<!-- Modal Overlay Background -->
<div id="modalOverlay" class="modal-overlay" role="presentation" hidden>
  
  <!-- The Modal Dialog Box -->
  <div 
    id="myModal" 
    class="modal-box" 
    role="dialog" 
    aria-modal="true" 
    aria-labelledby="modalTitle" 
    aria-describedby="modalDesc"
    tabindex="-1">
    
    <!-- Close Button -->
    <button id="closeModalBtn" class="modal-close-btn" aria-label="Close modal">&times;</button>
    
    <!-- Modal Content -->
    <h2 id="modalTitle">Accessible Modal Dialog</h2>
    <p id="modalDesc">This modal is fully keyboard-accessible, traps focus, and supports screen readers using standard ARIA patterns.</p>
    
    <!-- Action inside modal -->
    <div class="modal-actions">
      <button id="modalActionBtn" class="primary-btn">Got It!</button>
    </div>
  </div>
  
</div>
